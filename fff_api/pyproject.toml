[project]
name = "fff-scraper"
version = "0.1.0"
description = "Automated scraper for FFF API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "minio>=7.2.0",
    "alembic>=1.18.1",
    "psycopg2-binary>=2.9.11",
    "pyyaml>=6.0",
    "bcrypt>=4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "Faker>=19.0.0"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0"
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
